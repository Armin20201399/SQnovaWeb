<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>۴۰۴ - صفحه پیدا نشد | SQ Nova</title>
  <meta name="description" content="صفحه مورد نظر یافت نشد - SQ Nova" />

  <!-- Google Fonts: Vazirmatn (Farsi), Plus Jakarta Sans & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Rajdhani:wght@600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #020617;
      --text-heading: #f1f5f9;
      --text-desc: #94a3b8;
      --text-muted: #64748b;
      --gradient-pink: #ec4899;
      --gradient-purple: #a855f7;
      --gradient-blue: #3b82f6;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-heading);
      font-family: 'Vazirmatn', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.18;
      transition: opacity 0.5s ease;
    }

    .glow-1 {
      width: clamp(280px, 45vw, 550px);
      height: clamp(280px, 45vw, 550px);
      top: 15%;
      left: 15%;
      background: radial-gradient(circle, var(--gradient-pink), var(--gradient-purple));
      animation: floatSlow 12s ease-in-out infinite alternate;
    }

    .glow-2 {
      width: clamp(250px, 40vw, 500px);
      height: clamp(250px, 40vw, 500px);
      bottom: 15%;
      right: 15%;
      background: radial-gradient(circle, var(--gradient-purple), var(--gradient-blue));
      animation: floatSlow 16s ease-in-out infinite alternate-reverse;
    }

    /* Subtle Background Grid Pattern */
    .bg-pattern {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
    }

    /* Top Spacing Placeholder */
    .top-spacer {
      width: 100%;
      height: 1rem;
    }

    /* Main Center Container */
    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 640px;
      width: 100%;
      margin: auto;
      padding: 1.5rem 0;
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 404 Number */
    .error-code-wrapper {
      position: relative;
      user-select: none;
      margin-bottom: 0.5rem;
    }

    .error-code {
      font-family: 'Vazirmatn', 'Rajdhani', sans-serif;
      font-size: clamp(125px, 24vw, 195px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 15px 35px rgba(168, 85, 247, 0.3));
      position: relative;
      display: inline-block;
    }

    .error-code-glow {
      position: absolute;
      inset: 0;
      font-family: 'Vazirmatn', 'Rajdhani', sans-serif;
      font-size: clamp(125px, 24vw, 195px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      color: rgba(168, 85, 247, 0.25);
      filter: blur(32px);
      z-index: -1;
      pointer-events: none;
      display: inline-block;
    }

    /* Heading <h1> */
    .error-heading {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-weight: 800;
      color: var(--text-heading);
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    /* Description <p> */
    .error-desc {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 400;
      color: var(--text-desc);
      max-width: 480px;
      line-height: 1.8;
      margin-bottom: 2.25rem;
    }

    /* Return Button (CTA) */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 2.2rem;
      background: linear-gradient(135deg, var(--gradient-pink) 0%, var(--gradient-purple) 50%, var(--gradient-blue) 100%);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 9999px;
      box-shadow: 0 8px 24px -4px rgba(236, 72, 153, 0.4), 0 4px 12px -2px rgba(168, 85, 247, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      white-space: nowrap;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 16px 36px -6px rgba(236, 72, 153, 0.55), 0 8px 20px -4px rgba(168, 85, 247, 0.5);
    }

    .cta-button:hover::before {
      opacity: 1;
    }

    .cta-button:active {
      transform: translateY(0) scale(0.98);
    }

    .cta-icon {
      font-size: 1.15rem;
      line-height: 1;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 10;
      margin-top: auto;
      padding-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      text-align: center;
      animation: fadeIn 1.2s ease;
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes floatSlow {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(25px, 20px) scale(1.08);
      }
    }

    /* Responsive Adjustments */
    @media (max-width: 480px) {
      body {
        padding: 1.25rem 1rem;
      }
      .error-desc {
        font-size: 0.925rem;
        margin-bottom: 1.75rem;
      }
      .cta-button {
        width: 100%;
        max-width: 280px;
        padding: 0.8rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effects -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="bg-pattern" aria-hidden="true"></div>

  <!-- Top Space -->
  <div class="top-spacer" aria-hidden="true"></div>

  <!-- Main Error Content -->
  <main class="main-container" id="error-content">
    <div class="error-code-wrapper">
      <div class="error-code-glow" aria-hidden="true">۴۰۴</div>
      <div class="error-code" id="error-code">۴۰۴</div>
    </div>

    <h1 class="error-heading" id="error-title">صفحه پیدا نشد!</h1>
    
    <p class="error-desc" id="error-description">
      متأسفانه صفحه‌ای که به دنبال آن بودید یافت نشد. ممکن است این صفحه حذف شده باشد یا آدرس وارد شده نادرست باشد.
    </p>

    <a href="/" class="cta-button" id="back-home-btn">
      <span class="cta-icon" aria-hidden="true">🏠</span>
      <span>بازگشت به خانه</span>
    </a>
  </main>

  <!-- Footer -->
  <footer class="footer" id="page-footer">
    <p>SQ Nova · همه‌ی حقوق محفوظ است</p>
  </footer>

</body>
</html>
