<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - عه اینجا اونجا نیس ؟! | SQ Nova</title>
    <meta name="description" content="صفحه مورد نظر یافت نشد - SQ Nova" />
    <meta property="og:title" content="404 - عه اینجا اونجا نیس ؟! | SQ Nova" />
    <meta property="og:description" content="صفحه مورد نظر یافت نشد." />
    <meta property="og:image" content="https://arminsq.ir/logo.jpeg" />
    <meta property="og:url" content="https://arminsq.ir" />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex, follow" />

    <!-- فونت‌ها -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-v16-arabic-regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-v16-arabic-bold.woff2" crossorigin />
    <link rel="preload" as="image" href="/assets/glow-mask.webp" crossorigin="anonymous" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #020617;
            --text: #f1f5f9;
            --desc: #94a3b8;
            --muted: #64748b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Vazirmatn', 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            margin: 0;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('/fonts/vazirmatn-v16-arabic-regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('/fonts/vazirmatn-v16-arabic-bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        /* ===== بک‌گراند باینری ===== */
        #binary-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* ===== گلوهای طیفی ===== */
        .glow-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }
        .glow-layer .glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background-color: rgba(147, 51, 234, 0.4);
            mask-image: url('/assets/glow-mask.webp');
            -webkit-mask-image: url('/assets/glow-mask.webp');
            mask-size: 100% 100%;
            -webkit-mask-size: 100% 100%;
            mask-repeat: no-repeat;
            -webkit-mask-repeat: no-repeat;
            filter: blur(40px);
            opacity: 0.55;
            mix-blend-mode: screen;
            transition: background-color 4s ease-in-out;
            will-change: background-color, transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .glow-left {
            top: 50%;
            left: 0;
            transform: translate(-25%, -50%);
            width: 900px;
            height: 900px;
        }
        .glow-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
        }
        .glow-right {
            top: 50%;
            right: 0;
            transform: translate(25%, -50%);
            width: 900px;
            height: 900px;
        }
        @media (max-width: 640px) {
            .glow-center {
                display: none;
            }
            .glow-left {
                transform: translate(-50%, -50%);
                width: 700px;
                height: 700px;
            }
            .glow-right {
                transform: translate(50%, -50%);
                width: 700px;
                height: 700px;
            }
        }

        /* ===== محتوای اصلی ===== */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 640px;
            width: 100%;
            min-height: 70vh;
            padding: 1.5rem 1rem;
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .error-code-wrapper {
            position: relative;
            margin-bottom: 0.5rem;
            user-select: none;
        }
        .error-code-glow {
            position: absolute;
            inset: 0;
            font-family: 'Vazirmatn', 'Rajdhani', sans-serif;
            font-size: clamp(125px, 24vw, 195px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -2px;
            color: rgba(168, 85, 247, 0.25);
            filter: blur(32px);
            pointer-events: none;
            display: inline-block;
        }
        .error-code {
            font-family: 'Vazirmatn', 'Rajdhani', sans-serif;
            font-size: clamp(125px, 24vw, 195px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 15px 35px rgba(168, 85, 247, 0.3));
            display: inline-block;
            position: relative;
        }

        .error-heading {
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }
        .error-desc {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            font-weight: 400;
            color: var(--desc);
            max-width: 480px;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 2rem;
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            color: #fff;
            text-decoration: none;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 1rem;
            box-shadow: 0 8px 24px -4px rgba(124, 58, 237, 0.4), 0 4px 12px -2px rgba(236, 72, 153, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            white-space: nowrap;
            margin-top: 2.5rem;
            min-width: 200px;
            letter-spacing: 0.02em;
        }
        @media (min-width: 640px) {
            .cta-button {
                padding: 1rem 2.5rem;
                font-size: 1rem;
                min-width: 240px;
                margin-top: 3rem;
            }
        }
        .cta-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 36px -6px rgba(124, 58, 237, 0.55), 0 8px 20px -4px rgba(236, 72, 153, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .cta-button:active {
            transform: translateY(0) scale(0.98);
        }
        .cta-icon {
            font-size: 1.15rem;
            line-height: 1;
        }

        .footer {
            position: relative;
            z-index: 10;
            margin-top: auto;
            padding-top: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.02em;
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1.25rem 1rem;
            }
            .main-container {
                min-height: 60vh;
                padding: 1rem 0.5rem;
            }
            .error-desc {
                font-size: 0.925rem;
                margin-bottom: 1.5rem;
            }
            .cta-button {
                width: 100%;
                max-width: 280px;
                padding: 0.8rem 1.5rem;
                margin-top: 2rem;
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <!-- ===== بک‌گراند باینری ===== -->
    <canvas id="binary-canvas"></canvas>

    <!-- ===== گلوهای طیفی ===== -->
    <div class="glow-layer" id="glow-layer">
        <div class="glow glow-left" id="glow-left"></div>
        <div class="glow glow-center" id="glow-center"></div>
        <div class="glow glow-right" id="glow-right"></div>
    </div>

    <!-- ===== محتوای اصلی ===== -->
    <main class="main-container">
        <div class="error-code-wrapper">
            <div class="error-code-glow" aria-hidden="true">404</div>
            <div class="error-code">404</div>
        </div>
        <h1 class="error-heading">عه اینجا اونجا نیس ؟!</h1>
        <p class="error-desc">اگه گم شدی بزن روی برگشت به خونه !</p>
        <a href="/" class="cta-button"><span class="cta-icon" aria-hidden="true">🏠</span> برگشت به خونه</a>
    </main>

    <footer class="footer"><p>SQ Nova · همه‌ی حقوق محفوظ است</p></footer>

    <script>
        // ===== بک‌گراند باینری (کاملاً مشابه نسخه اصلی React) =====
        (function() {
            const canvas = document.getElementById('binary-canvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d', {
                alpha: false,
                desynchronized: true
            });
            if (!ctx) return;

            // ========== Constants ==========
            const FONT_SIZE = 14;
            const HIGH_END_FRAME_INTERVAL = 1000 / 24;
            const LOW_END_FRAME_INTERVAL = 1000 / 20;
            const HIGH_END_DPR = 1.5;
            const LOW_END_DPR = 1.25;
            const CHARS = ['0', '1'];
            const COLORS = [
                'rgba(56, 189, 248, ',
                'rgba(52, 211, 153, ',
                'rgba(251, 113, 133, ',
                'rgba(168, 85, 247, ',
                'rgba(251, 191, 36, ',
            ];
            const BACKGROUND_COLOR = '#020617';
            const TRAIL_COLOR = 'rgba(2, 6, 23, 0.1)';
            const BASE_FONT = FONT_SIZE + 'px monospace';

            // ========== Performance Profile ==========
            function getPerformanceProfile() {
                const hardwareConcurrency = navigator.hardwareConcurrency ?? 8;
                const deviceMemory = ('deviceMemory' in navigator) ?
                    Number(navigator.deviceMemory ?? 8) : 8;
                const saveData = ('connection' in navigator) ?
                    !!navigator.connection?.saveData : false;

                const isLowEnd = hardwareConcurrency <= 4 || deviceMemory <= 4 || saveData;

                return {
                    isLowEnd,
                    dpr: isLowEnd ? LOW_END_DPR : HIGH_END_DPR,
                    frameInterval: isLowEnd ? LOW_END_FRAME_INTERVAL : HIGH_END_FRAME_INTERVAL,
                };
            }

            // ========== State ==========
            const state = {
                width: 0,
                height: 0,
                dpr: 0,
                columns: 0,
                drops: [],
                isVisible: true,
                profile: getPerformanceProfile(),
            };

            let intervalId = null;
            let resizeTimer = null;

            // ========== Setup Canvas ==========
            function setupCanvas(forceRedraw) {
                forceRedraw = forceRedraw || false;

                const width = window.innerWidth;
                const height = window.innerHeight;
                const profile = getPerformanceProfile();
                const dpr = profile.dpr;

                const sizeChanged =
                    state.width !== width ||
                    state.height !== height ||
                    state.dpr !== dpr;

                if (!sizeChanged && !forceRedraw) {
                    state.profile = profile;
                    return;
                }

                canvas.width = Math.max(1, Math.floor(width * dpr));
                canvas.height = Math.max(1, Math.floor(height * dpr));
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Only repaint the full background when the canvas was created/resized
                ctx.fillStyle = BACKGROUND_COLOR;
                ctx.fillRect(0, 0, width, height);

                const nextColumns = Math.ceil(width / FONT_SIZE);

                // Preserve drops when columns change
                if (state.columns !== nextColumns) {
                    const prevDrops = state.drops;
                    const nextDrops = new Array(nextColumns);

                    for (let i = 0; i < nextColumns; i++) {
                        if (i < prevDrops.length) {
                            nextDrops[i] = prevDrops[i];
                        } else {
                            nextDrops[i] = Math.random() * Math.max(1, height / FONT_SIZE);
                        }
                    }

                    state.drops = nextDrops;
                    state.columns = nextColumns;
                } else if (state.drops.length === 0) {
                    state.drops = new Array(nextColumns).fill(1);
                    state.columns = nextColumns;
                }

                state.width = width;
                state.height = height;
                state.dpr = dpr;
                state.profile = profile;
            }

            // ========== Draw ==========
            function draw() {
                if (!state.isVisible) return;

                const { width, height, columns, drops, profile } = state;
                if (!width || !height || !columns || !drops.length) return;

                ctx.fillStyle = TRAIL_COLOR;
                ctx.fillRect(0, 0, width, height);

                ctx.font = BASE_FONT;
                ctx.textBaseline = 'alphabetic';
                ctx.shadowBlur = 0;

                const now = performance.now();
                const charPhase = Math.floor(now / 180);
                const highlightPhase = Math.floor(now / 500);
                const resetPhase = Math.floor(now / 1000);

                for (let i = 0; i < columns; i++) {
                    const char = CHARS[(i + charPhase) & 1];
                    const colorBase = COLORS[i % COLORS.length];
                    const alpha = 0.16 + ((i * 7) % 28) / 100;
                    const x = i * FONT_SIZE;
                    const y = drops[i] * FONT_SIZE;

                    const isHighlight = ((i * 17 + highlightPhase) % 101) === 0;

                    if (isHighlight) {
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = profile.isLowEnd ? 5 : 8;
                        ctx.shadowColor = '#fff';
                    } else {
                        ctx.fillStyle = colorBase + alpha + ')';
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillText(char, x, y);

                    if (y > height && ((i * 13 + resetPhase) % 100) > 96) {
                        drops[i] = 0;
                    }

                    drops[i] += 1;
                }

                ctx.shadowBlur = 0;
            }

            // ========== Animation Loop ==========
            function tick() {
                if (!state.isVisible) return;
                draw();
            }

            function startAnimation() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }

                const { frameInterval } = getPerformanceProfile();
                intervalId = setInterval(tick, frameInterval);
            }

            // ========== Resize Handler ==========
            function handleResize() {
                if (resizeTimer) {
                    clearTimeout(resizeTimer);
                }

                resizeTimer = setTimeout(function() {
                    setupCanvas(false);
                    resizeTimer = null;
                }, 200);
            }

            // ========== Visibility Change ==========
            function handleVisibilityChange() {
                if (document.hidden) {
                    state.isVisible = false;

                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                } else {
                    state.isVisible = true;

                    // Restore canvas state without resetting drops
                    setupCanvas(false);

                    startAnimation();
                }
            }

            // ========== Init ==========
            function init() {
                setupCanvas(true);
                startAnimation();

                window.addEventListener('resize', handleResize, { passive: true });
                document.addEventListener('visibilitychange', handleVisibilityChange, { passive: true });

                window.addEventListener('beforeunload', function() {
                    if (intervalId) {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                    if (resizeTimer) {
                        clearTimeout(resizeTimer);
                        resizeTimer = null;
                    }
                });
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }
        })();

        // ===== گلوهای طیفی (بدون تغییر) =====
        (function() {
            const COLORS_RGB = [
                '147, 51, 234',
                '219, 39, 119',
                '14, 165, 233',
                '16, 185, 129',
                '245, 158, 11',
                '249, 115, 22',
                '236, 72, 153',
                '99, 102, 241'
            ];

            const glowElements = document.querySelectorAll('.glow');

            function getRandomColor() {
                return COLORS_RGB[Math.floor(Math.random() * COLORS_RGB.length)];
            }

            function setRandomColor(el) {
                const rgb = getRandomColor();
                el.style.backgroundColor = 'rgba(' + rgb + ', 0.45)';
            }

            glowElements.forEach(function(el) {
                setRandomColor(el);
            });

            setInterval(function() {
                glowElements.forEach(function(el) {
                    setRandomColor(el);
                });
            }, 5000);
        })();
    </script>
</body>
</html>
