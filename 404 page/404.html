<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>۴۰۴ - عه اینجا اونجا نیس ؟! | SQ Nova</title>
<meta name="description" content="صفحه مورد نظر یافت نشد - SQ Nova" />
<meta property="og:title" content="۴۰۴ - عه اینجا اونجا نیس ؟! | SQ Nova" />
<meta property="og:description" content="صفحه مورد نظر یافت نشد." />
<meta property="og:image" content="https://arminsq.ir/logo.jpeg" />
<meta property="og:url" content="https://arminsq.ir" />
<meta property="og:type" content="website" />
<meta name="robots" content="noindex, follow" />
<style>
/*! 404 Page - Minified */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020617;--text:#f1f5f9;--desc:#94a3b8;--muted:#64748b}
body{background:var(--bg);color:var(--text);font-family:'Vazirmatn','Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:1.5rem;position:relative;overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased}
@font-face{font-family:'Vazirmatn';src:url('/fonts/vazirmatn-v16-arabic-regular.woff2') format('woff2');font-weight:400;font-display:swap;font-style:normal}
@font-face{font-family:'Vazirmatn';src:url('/fonts/vazirmatn-v16-arabic-700.woff2') format('woff2');font-weight:700;font-display:swap;font-style:normal}
.ambient-glow{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:0.18;transition:opacity .5s ease}
.glow-1{width:clamp(280px,45vw,550px);height:clamp(280px,45vw,550px);top:15%;left:15%;background:radial-gradient(circle,#ec4899,#a855f7);animation:floatSlow 12s ease-in-out infinite alternate}
.glow-2{width:clamp(250px,40vw,500px);height:clamp(250px,40vw,500px);bottom:15%;right:15%;background:radial-gradient(circle,#a855f7,#3b82f6);animation:floatSlow 16s ease-in-out infinite alternate-reverse}
.bg-pattern{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0;opacity:.7}
.main-container{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:640px;width:100%;margin:auto;padding:1.5rem 0;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1)}
.error-code{font-family:'Vazirmatn','Rajdhani',sans-serif;font-size:clamp(125px,24vw,195px);font-weight:900;line-height:.95;letter-spacing:-2px;background:linear-gradient(135deg,#ec4899 0%,#a855f7 50%,#3b82f6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 15px 35px rgba(168,85,247,.3));display:inline-block;position:relative}
.error-code-glow{position:absolute;inset:0;font-family:'Vazirmatn','Rajdhani',sans-serif;font-size:clamp(125px,24vw,195px);font-weight:900;line-height:.95;letter-spacing:-2px;color:rgba(168,85,247,.25);filter:blur(32px);z-index:-1;pointer-events:none;display:inline-block}
.error-heading{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;color:var(--text);margin-bottom:1rem;letter-spacing:-.02em}
.error-desc{font-size:clamp(.95rem,2vw,1.1rem);font-weight:400;color:var(--desc);max-width:480px;line-height:1.8;margin-bottom:2.25rem}
.cta-button{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.85rem 2.2rem;background:linear-gradient(135deg,#ec4899 0%,#a855f7 50%,#3b82f6 100%);color:#fff;text-decoration:none;font-family:'Vazirmatn',sans-serif;font-size:1rem;font-weight:700;border-radius:9999px;box-shadow:0 8px 24px -4px rgba(236,72,153,.4),0 4px 12px -2px rgba(168,85,247,.35);transition:all .3s cubic-bezier(.16,1,.3,1);border:1px solid rgba(255,255,255,.2);cursor:pointer;white-space:nowrap}
.cta-button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 36px -6px rgba(236,72,153,.55),0 8px 20px -4px rgba(168,85,247,.5)}
.cta-button:active{transform:translateY(0) scale(.98)}
.cta-icon{font-size:1.15rem;line-height:1}
.footer{position:relative;z-index:10;margin-top:auto;padding-top:1.5rem;font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:.02em;text-align:center;animation:fadeIn 1.2s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatSlow{0%{transform:translate(0,0) scale(1)}100%{transform:translate(25px,20px) scale(1.08)}}
@media (max-width:480px){body{padding:1.25rem 1rem}.error-desc{font-size:.925rem;margin-bottom:1.75rem}.cta-button{width:100%;max-width:280px;padding:.8rem 1.5rem}}
</style>
</head>
<body>
<div class="ambient-glow glow-1" aria-hidden="true"></div>
<div class="ambient-glow glow-2" aria-hidden="true"></div>
<div class="bg-pattern" aria-hidden="true"></div>
<main class="main-container">
<div class="error-code-wrapper" style="position:relative;margin-bottom:.5rem;user-select:none">
<div class="error-code-glow" aria-hidden="true">404</div>
<div class="error-code">404</div>
</div>
<h1 class="error-heading">عه اینجا اونجا نیس ؟!</h1>
<p class="error-desc">اگه گم شدی بزن روی برگشت به خونه !</p>
<a href="/" class="cta-button"><span class="cta-icon" aria-hidden="true">🏠</span> برگشت به خونه</a>
</main>
<footer class="footer"><p>SQ Nova · همه‌ی حقوق محفوظ است</p></footer>
</body>
</html>
