    <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-v16-arabic-regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-v16-arabic-bold.woff2" crossorigin />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #020617;
            --text: #f1f5f9;
            --desc: #94a3b8;
            --muted: #64748b;
        }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a, button { font: inherit; }
        button { border: 0; }
        @font-face { font-family: 'Vazirmatn'; src: url('/fonts/vazirmatn-v16-arabic-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'Vazirmatn'; src: url('/fonts/vazirmatn-v16-arabic-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }

        /* ===== Header ===== */
        .site-header {
            position: sticky; top: 0; z-index: 50; width: 100%;
            background: rgba(2, 6, 23, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(14px);
        }
        .nav-shell { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
        .nav-row { display: flex; align-items: center; height: 64px; }
        @media (min-width: 1024px) { .nav-row { height: 80px; } }
        .logo-container { display: inline-flex; align-items: center; gap: .75rem; text-decoration: none; cursor: pointer; }
        .logo-wrapper { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .logo-glow { position: absolute; inset: 0; border-radius: 1rem; filter: blur(20px); transition: all .3s ease-out; pointer-events: none; opacity: .5; background: rgba(16,185,129,.2); }
        .logo-wrapper:hover .logo-glow { opacity: 1; transform: scale(1.1); background: rgba(16,185,129,.5); }
        .logo-box {
            position: relative; width: 64px; height: 64px; border-radius: 1rem;
            background: rgba(2,6,23,.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(16,185,129,.5); display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: all .3s ease-out; box-shadow: 0 0 20px rgba(16,185,129,.2);
        }
        @media (max-width: 640px) { .logo-box { width: 56px; height: 56px; } }
        .logo-wrapper:hover .logo-box { transform: scale(1.1); border-color: #34d399; box-shadow: 0 0 40px rgba(16,185,129,.6); }
        .logo-binary-bg {
            position: absolute; inset: 0; font-family: monospace; font-size: 10px; line-height: 11px; font-weight: bold;
            color: rgba(52,211,153,.9); display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; text-shadow: 0 0 6px rgba(16,185,129,.9); opacity: .7; transition: opacity .3s ease;
        }
        .logo-wrapper:hover .logo-binary-bg { opacity: 1; }
        .logo-star { position: relative; z-index: 2; width: 36px; height: 36px; fill: url(#star-gradient); stroke: #fff; stroke-width: 2.2; stroke-linejoin: round; transition: all .5s ease-out; filter: drop-shadow(0 0 10px rgba(16,185,129,.8)); }
        @media (max-width: 640px) { .logo-star { width: 32px; height: 32px; } }
        .logo-wrapper:hover .logo-star { transform: scale(1.25) rotate(12deg); filter: drop-shadow(0 0 20px rgba(52,211,153,1)); }
        .logo-text { display: flex; align-items: center; }
        .logo-sq-nova { display: flex; gap: 4px; font-weight: 900; font-size: 1.4rem; line-height: 1; }
        .logo-sq { background: linear-gradient(to right,#f59e0b,#fbbf24,#f59e0b); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 10px rgba(245,158,11,.7)); }
        .logo-nova { background: linear-gradient(to right,#ec4899,#a855f7); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 10px rgba(236,72,153,.5)); }

        /* ===== بک‌گراند ===== */
        #binary-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events:none; }
        .glow-layer { position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
        .glow-layer .glow { position:absolute; border-radius:50%; filter:blur(40px); opacity:.55; mix-blend-mode:screen; }
        .glow-left { top:50%; left:0; transform:translate(-25%,-50%); width:900px; height:900px; background:rgba(168,85,247,.18); }
        .glow-center { top:50%; left:50%; transform:translate(-50%,-50%); width:900px; height:900px; background:rgba(251,113,133,.12); }
        .glow-right { top:50%; right:0; transform:translate(25%,-50%); width:900px; height:900px; background:rgba(56,189,248,.14); }

        /* ===== محتوای 404 ===== */
        main { position:relative; z-index:10; flex:1; display:flex; align-items:center; justify-content:center; text-align:center; }
        .main-container { width:100%; max-width:760px; padding:6rem 1rem; animation:fadeInUp .9s cubic-bezier(.16,1,.3,1); }
        .error-code-wrapper { position:relative; margin-bottom:1rem; }
        .error-code-glow { position:absolute; inset:0; font-size:clamp(120px,24vw,195px); font-weight:900; color:rgba(168,85,247,.25); filter:blur(32px); }
        .error-code { position:relative; font-size:clamp(120px,24vw,195px); font-weight:900; line-height:.95; background:linear-gradient(135deg,#ec4899 0%,#a855f7 50%,#3b82f6 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 15px 35px rgba(168,85,247,.3)); }
        .error-heading { font-size:clamp(1.5rem,4vw,2.25rem); font-weight:800; color:var(--text); margin-bottom:.75rem; }
        .error-desc { font-size:clamp(.95rem,2vw,1.1rem); color:var(--desc); line-height:1.9; }

        /* ===== Footer ===== */
        .site-footer {
            position: relative; z-index: 10;
            padding: 2rem 1rem;
            border-top: 1px solid rgba(255,255,255,.1);
            background: rgba(2,6,23,.95);
            color: #cbd5e1;
            text-align: center;
            font-size: .75rem;
        }

        @keyframes flame-binary-flicker { 0%,100%{opacity:1} 50%{opacity:.3} }
        .flame-binary-line { animation:flame-binary-flicker 2.4s steps(1) infinite; }
        .flame-binary-line:nth-child(2){animation-delay:.3s}.flame-binary-line:nth-child(3){animation-delay:.6s}.flame-binary-line:nth-child(4){animation-delay:.9s}
        @keyframes fadeInUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        @media (max-width:768px) { #binary-canvas,.glow-layer{display:none!important} .main-container{padding:5rem 1rem} }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-shell">
            <div class="nav-row">
                <a href="/#hero-section" class="logo-container" aria-label="بازگشت به خانه">
                    <div class="logo-wrapper">
                        <div class="logo-glow"></div>
                        <div class="logo-box">
                            <div class="logo-binary-bg">
                                <div class="flame-binary-line">1011</div>
                                <div class="flame-binary-line">0101</div>
                                <div class="flame-binary-line">1100</div>
                                <div class="flame-binary-line">0011</div>
                                <div class="flame-binary-line">1010</div>
                            </div>
                            <svg class="logo-star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <defs><linearGradient id="star-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d1fae5"/><stop offset="50%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
                                <polygon points="50,12 62,37 88,40 69,58 74,84 50,71 26,84 31,58 12,40 38,37" />
                            </svg>
                        </div>
                    </div>
                    <div class="logo-text"><div class="logo-sq-nova"><span class="logo-nova">nova</span><span class="logo-sq">SQ</span></div></div>
                </a>
            </div>
        </div>
    </header>

    <canvas id="binary-canvas" aria-hidden="true"></canvas>
    <div class="glow-layer" aria-hidden="true">
        <div class="glow glow-left"></div>
        <div class="glow glow-center"></div>
        <div class="glow glow-right"></div>
    </div>

    <main>
        <section class="main-container" aria-labelledby="error-heading">
            <div class="error-code-wrapper">
                <div class="error-code-glow" aria-hidden="true">404</div>
                <div class="error-code">404</div>
            </div>
            <h1 id="error-heading" class="error-heading">عه اینجا اونجا نیس ؟!</h1>
            <p class="error-desc">اگه گم شدی بزن روی ستاره اون بالا !</p>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 SQ nova • All Rights Reserved.</p>
    </footer>

    <script>
        (function () {
            const isMobile = window.matchMedia("(max-width: 768px)").matches;
            if (isMobile) return;

            const canvas = document.getElementById('binary-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
            if (!ctx) return;

            const FONT_SIZE = 14;
            const COLORS = [
                'rgba(56, 189, 248, ',
                'rgba(52, 211, 153, ',
                'rgba(251, 113, 133, ',
                'rgba(168, 85, 247, ',
                'rgba(251, 191, 36, '
            ];
            const BACKGROUND_COLOR = '#020617';
            const TRAIL_COLOR = 'rgba(2, 6, 23, 0.1)';

            const getProfile = () => {
                const hardwareConcurrency = navigator.hardwareConcurrency ?? 8;
                const deviceMemory = 'deviceMemory' in navigator
                    ? Number((navigator.deviceMemory ?? 8))
                    : 8;
                const saveData = 'connection' in navigator
                    ? Boolean(navigator.connection?.saveData)
                    : false;
                const isLowEnd = hardwareConcurrency <= 4 || deviceMemory <= 4 || saveData;
                return {
                    dpr: isLowEnd ? 1.25 : 1.5,
                    frameInterval: isLowEnd ? 1000 / 20 : 1000 / 24
                };
            };

            let width = 0, height = 0, drops = [], columnX = [], columnStyles = [];
            let lastFrameTime = 0;
            let animationFrame = null;
            let isVisible = true;
            let resizeTimer = null;
            let profile = getProfile();

            function setupCanvas() {
                const nextProfile = getProfile();
                profile = nextProfile;
                width = window.innerWidth;
                height = window.innerHeight;
                const dpr = profile.dpr;

                canvas.width = Math.max(1, Math.floor(width * dpr));
                canvas.height = Math.max(1, Math.floor(height * dpr));
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = BACKGROUND_COLOR;
                ctx.fillRect(0, 0, width, height);
                ctx.font = FONT_SIZE + 'px monospace';
                ctx.textBaseline = 'alphabetic';

                const columns = Math.ceil(width / FONT_SIZE);
                const previousDrops = drops;
                const nextDrops = new Array(columns);
                columnX = new Array(columns);
                columnStyles = new Array(columns);

                for (let i = 0; i < columns; i++) {
                    columnX[i] = i * FONT_SIZE;
                    const colorBase = COLORS[i % COLORS.length];
                    const alpha = 0.16 + ((i * 7) % 28) / 100;
                    columnStyles[i] = colorBase + alpha + ')';
                    nextDrops[i] = i < previousDrops.length
                        ? previousDrops[i]
                        : Math.random() * Math.max(1, height / FONT_SIZE);
                }

                drops = nextDrops;
            }

            function draw(time) {
                if (!width || !height || !drops.length) return;
                ctx.fillStyle = TRAIL_COLOR;
                ctx.fillRect(0, 0, width, height);
                ctx.shadowBlur = 0;

                const charPhase = Math.floor(time / 180);
                const highlightPhase = Math.floor(time / 500);
                const resetPhase = Math.floor(time / 1000);

                for (let i = 0; i < drops.length; i++) {
                    const char = ((i + charPhase) & 1) ? '1' : '0';
                    const x = columnX[i];
                    const y = drops[i] * FONT_SIZE;
                    const isHighlight = ((i * 17 + highlightPhase) % 101) === 0;

                    if (isHighlight) {
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = profile.dpr > 1.25 ? 8 : 5;
                        ctx.shadowColor = '#fff';
                    } else {
                        ctx.fillStyle = columnStyles[i];
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillText(char, x, y);

                    if (y > height && ((i * 13 + resetPhase) % 100) > 96) {
                        drops[i] = 0;
                    }
                    drops[i] += 1;
                }
                ctx.shadowBlur = 0;
            }

            function animate(time) {
                if (!isVisible) return;
                if (time - lastFrameTime >= profile.frameInterval) {
                    lastFrameTime = time;
                    draw(time);
                }
                animationFrame = requestAnimationFrame(animate);
            }

            function startAnimation() {
                if (animationFrame !== null) return;
                lastFrameTime = performance.now();
                animationFrame = requestAnimationFrame(animate);
            }

            setupCanvas();
            startAnimation();

            window.addEventListener('resize', function () {
                if (resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(setupCanvas, 200);
            }, { passive: true });

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    isVisible = false;
                    if (animationFrame !== null) {
                        cancelAnimationFrame(animationFrame);
                        animationFrame = null;
                    }
                } else {
                    isVisible = true;
                    startAnimation();
                }
            });
        })();
    </script>
</body>
</html>
